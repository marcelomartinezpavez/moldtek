spring:
  application:
    name: moldtek-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/moldtek_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

moldtek:
  jwt:
    secret: moldtek-jwt-secret-key-2024-must-be-256-bits-minimum-length-32chars
    expiration: 86400000  # 24 hours in ms
  upload:
    dir: ./uploads
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000

logging:
  level:
    cl.moldtek: DEBUG
    org.springframework.security: INFO
